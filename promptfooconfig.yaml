description: digarr production-prompt recommendation baseline

# Run bun run eval:quality prepare before evaluating. Generated cases and
# bundled assertions stay in ignored evaluation-results. Neighbor checks are
# advisory smoke checks, not a measure of subjective recommendation fit.
prompts:
  - '{{recommendationPrompt}}'

providers:
  - anthropic:messages:claude-haiku-4-5-20251001
  - openai:chat:gpt-5.4-mini

tests: file://evaluation-results/recommendation-quality/cases.json
