name: Companion templates
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compare published Unraid templates
        run: |
          set -euo pipefail
          if python3 scripts/check-unraid-companions.py --format markdown > companion-report.md; then
            echo "Published companion templates align."
          else
            result=$?
            if [ "$result" -eq 1 ]; then
              echo "::warning::Published companion templates differ; inspect the report and pending PRs."
            elif [ "$result" -eq 2 ]; then
              echo "::warning::Companion state could not be verified; inspect the retrieval errors."
            else
              exit "$result"
            fi
          fi
          cat companion-report.md >> "$GITHUB_STEP_SUMMARY"
