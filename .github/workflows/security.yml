name: Security
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit --audit-level=high

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          # advisory-only: findings surface in code scanning (SARIF upload).
          # Revisit once we have a baseline + `.trivyignore` with dated entries.
          exit-code: "0"
          # Pin binary version; v0.69.4-v0.69.6 contained credential-stealing malware (CVE-2026-33634)
          version: "v0.76.2"
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  trivy-image:
    name: Trivy container scan (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian]
    # Heavy (builds the image): main-only + weekly schedule, so develop PRs stay
    # cheap. Also skip when DOCKERHUB secrets are unavailable (fork PRs, dependabot).
    if: >-
      (github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.base_ref == 'main') &&
      (github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'))
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build image
        run: |
          build_args=()
          if [ "${{ matrix.variant }}" = "debian" ]; then
            # Same slim pin the release matrix uses, read from there so it lives in one place.
            slim="$(grep -oE 'oven/bun:[0-9.]+-slim@sha256:[0-9a-f]{64}' .github/workflows/release.yml | head -1)"
            test -n "$slim" || { echo "no slim runtime pin found in release.yml" >&2; exit 1; }
            build_args=(--build-arg "RUNTIME_IMAGE=$slim")
          fi
          docker build "${build_args[@]}" -t digarr:scan -f deploy/docker/Dockerfile .
      # advisory-only: base image CVEs are upstream, patched via dependabot
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: digarr:scan
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image-${{ matrix.variant }}.sarif
          # Pin binary version; v0.69.4-v0.69.6 contained credential-stealing malware (CVE-2026-33634)
          version: "v0.76.2"
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.variant }}.sarif
          category: trivy-image-${{ matrix.variant }}

  codeql:
    runs-on: ubuntu-26.04
    # Heavy (full analysis): main-only + weekly schedule, so develop PRs stay cheap.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.base_ref == 'main'
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
