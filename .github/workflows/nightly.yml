name: Nightly

# Intentionally NOT gated on the CI workflow. `:nightly` is a throwaway,
# bleeding-edge channel: pushes to develop are squash-merges of PRs that already
# passed full CI (or trivial direct CI/config commits), so a broken build
# reaching :nightly is acceptable and self-correcting (the next develop push
# moves the tag). Bug reports against nightly cite the footer / GET /health sha.
# A tagged release (release.yml) is the gated, signed path; nightly is not.

on:
  push:
    branches:
      - develop

# A newer push to develop cancels an in-flight build: the moving :nightly always
# converges on the latest commit, but a superseded commit's :nightly-<sha> tag
# may never publish. Acceptable for a dev channel (latest-develop is the intent).
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Short SHA
        id: sha
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :nightly
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly-${{ steps.sha.outputs.short }}
          build-args: |
            DIGARR_GIT_SHA=${{ github.sha }}
            DIGARR_CHANNEL=nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
