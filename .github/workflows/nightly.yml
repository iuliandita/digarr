name: Nightly

# Intentionally NOT gated on the CI workflow. `:nightly` is a throwaway,
# bleeding-edge channel: pushes to develop are squash-merges of PRs that already
# passed full CI (or trivial direct CI/config commits), so a broken build
# reaching :nightly is acceptable and self-correcting (the next develop push
# moves the tag). Bug reports against nightly cite the footer / GET /health sha.
# A tagged release (release.yml) is the gated, signed path; nightly is not.

on:
  push:
    branches:
      - develop

# A newer push to develop cancels an in-flight build: the moving :nightly always
# converges on the latest commit, but a superseded commit's :nightly-<sha> tag
# may never publish. Acceptable for a dev channel (latest-develop is the intent).
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Short SHA
        id: sha
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :nightly
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly-${{ steps.sha.outputs.short }}
          build-args: |
            DIGARR_GIT_SHA=${{ github.sha }}
            DIGARR_CHANNEL=nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
