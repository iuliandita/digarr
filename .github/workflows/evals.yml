name: AI Recommendation Evals

# Advisory eval gate. Runs promptfoo against the live recommendation prompt to
# flag quality regressions in provider choice or prompt wording. Never blocks
# merge - failures are informational.
#
# Triggered manually because the evals cost real API tokens and require
# ANTHROPIC_API_KEY + OPENAI_API_KEY to be configured in repository secrets.
# Promote to PR-trigger once the secrets are in place and the fixtures are
# stable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Prepare production-prompt fixtures
        run: bun run eval:quality prepare
      - name: Run promptfoo evals
        run: npx --yes promptfoo@0.119.0 eval --config promptfooconfig.yaml --output evaluation-results/recommendation-quality/promptfoo.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recommendation-quality
          path: evaluation-results/recommendation-quality/
          retention-days: 14
      - name: Mark result as advisory
        if: always()
        run: echo "::notice::AI recommendation evals are advisory - review results but do not block merge on failure."
