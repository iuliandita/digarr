name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.12.13)"
        required: true

# Workflow baseline is read-only. Jobs that need more (docker) escalate per-job.
permissions:
  contents: read

# Serialize releases on the same ref; never cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run i18n:check
      - run: bun run test

  docker:
    runs-on: ubuntu-24.04
    needs: quality-gate
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless signing via Sigstore OIDC
      attestations: write # actions/attest-build-provenance
    strategy:
      matrix:
        include:
          # alpine is primary: owns unsuffixed :latest/:vX.Y.Z + the release/SBOM steps.
          - variant: alpine
            runtime-image: "oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0"
            suffix: ""
            latest: "auto"
          - variant: debian
            runtime-image: "oven/bun:1.3.14-slim@sha256:d56a2534ffd262e92c12fd3249d3924d296d97086da773f821d7d0477435ea04"
            suffix: "-debian"
            latest: "false"
    steps:
      # Check out the released tag itself, not the workflow trigger ref. On a
      # workflow_dispatch run github.ref is the branch HEAD, so without this the
      # build context and the baked git sha would come from HEAD, not the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve commit sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3"
            exit 1
          fi

          echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/iuliandita/digarr
          flavor: |
            suffix=${{ matrix.suffix }}
            latest=${{ matrix.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.value }}
            type=raw,value=debian,enable=${{ matrix.variant == 'debian' }},suffix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNTIME_IMAGE=${{ matrix.runtime-image }}
            DIGARR_GIT_SHA=${{ steps.sha.outputs.sha }}
            DIGARR_CHANNEL=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: docker.io/iuliandita/digarr
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign images (cosign keyless)
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/digarr
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          cosign sign --yes "${DOCKER_IMAGE}@${DIGEST}"

      - name: Generate SBOM (container)
        if: matrix.variant == 'alpine'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_REF }}
          artifact-name: sbom-container.spdx.json
          output-file: sbom-container.spdx.json

      - name: Generate SBOM (source)
        if: matrix.variant == 'alpine'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          artifact-name: sbom-source.spdx.json
          output-file: sbom-source.spdx.json

      - name: Attest SBOM (container) via cosign
        if: matrix.variant == 'alpine'
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/digarr
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom-container.spdx.json "${GHCR_IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom-container.spdx.json "${DOCKER_IMAGE}@${DIGEST}"

      - name: Ensure release exists and upload SBOMs
        if: matrix.variant == 'alpine'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping create"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" sbom-container.spdx.json sbom-source.spdx.json --clobber

  verify-digest-sync:
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
      - name: Assert deploy artefacts carry the same digest
        run: |
          k8s=$(grep -oE 'sha256:[a-f0-9]+' deploy/k8s/deployment.yaml | head -1)
          helm=$(grep -oE 'sha256:[a-f0-9]+' deploy/helm/digarr/values.yaml | head -1)
          unraid=$(grep -oE 'sha256:[a-f0-9]+' deploy/unraid/digarr.xml | head -1)
          if [ -z "$k8s" ] || [ -z "$helm" ] || [ -z "$unraid" ]; then
            echo "missing digest in one or more deploy files:"
            echo "  k8s=$k8s"
            echo "  helm=$helm"
            echo "  unraid=$unraid"
            exit 1
          fi
          if [ "$k8s" != "$helm" ] || [ "$k8s" != "$unraid" ]; then
            echo "digest drift detected:"
            echo "  k8s=$k8s"
            echo "  helm=$helm"
            echo "  unraid=$unraid"
            echo "Run: bun scripts/sync-deploy-digests.ts <tag>"
            exit 1
          fi
          echo "digests aligned: $k8s"
