name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (vX.Y.Z, matching package.json)"
        required: true

# Workflow baseline is read-only. Jobs that need more (docker) escalate per-job.
permissions:
  contents: read

# Serialize releases on the same ref; never cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gate:
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
      - name: Require release commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release commit $(git rev-parse HEAD) is not reachable from origin/main; refusing to release."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun scripts/check-release-identity.ts "$RELEASE_TAG"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run i18n:check
      - run: bun run check:docs
      - run: bun run test

  docker:
    runs-on: ubuntu-26.04
    needs: quality-gate
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing via Sigstore OIDC
      attestations: write # actions/attest-build-provenance
    strategy:
      matrix:
        include:
          # alpine is primary: owns unsuffixed :latest/:vX.Y.Z and the source SBOM.
          - variant: alpine
            runtime-image: "oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a"
            suffix: ""
            latest: "auto"
            sbom-file: sbom-container.spdx.json
          - variant: debian
            runtime-image: "oven/bun:1.4.4-slim@sha256:1846adf22496bd711036aae8be147e57bdebbaea2e5264e3e0b5af1db187d9a4"
            suffix: "-debian"
            latest: "false"
            sbom-file: sbom-container-debian.spdx.json
    steps:
      # Build the exact commit that passed the quality gate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.quality-gate.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/iuliandita/digarr
          flavor: |
            suffix=${{ matrix.suffix }}
            latest=${{ matrix.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.quality-gate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.quality-gate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.quality-gate.outputs.tag }}
            type=raw,value=debian,enable=${{ matrix.variant == 'debian' }},suffix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNTIME_IMAGE=${{ matrix.runtime-image }}
            DIGARR_GIT_SHA=${{ needs.quality-gate.outputs.sha }}
            DIGARR_CHANNEL=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/iuliandita/digarr
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign images (cosign keyless)
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/digarr
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          cosign sign --yes "${DOCKER_IMAGE}@${DIGEST}"

      - name: Generate SBOM (container)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SYFT_PLATFORM: linux/amd64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          artifact-name: ${{ matrix.sbom-file }}
          output-file: ${{ matrix.sbom-file }}
          upload-release-assets: false

      - name: Generate SBOM (source)
        if: matrix.variant == 'alpine'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-source.spdx.json
          output-file: sbom-source.spdx.json
          upload-release-assets: false

      - name: Attest SBOM (container) via cosign
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/digarr
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM_FILE: ${{ matrix.sbom-file }}
        run: |
          cosign attest --yes --type spdxjson --predicate "$SBOM_FILE" "${GHCR_IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate "$SBOM_FILE" "${DOCKER_IMAGE}@${DIGEST}"

  publish-sboms:
    needs: [quality-gate, docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*.spdx.json
          merge-multiple: true
          path: sboms

      - name: Ensure release exists and upload SBOMs
        working-directory: sboms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.quality-gate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s sbom-container.spdx.json
          test -s sbom-container-debian.spdx.json
          test -s sbom-source.spdx.json
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping create"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" sbom-container.spdx.json sbom-container-debian.spdx.json sbom-source.spdx.json --repo "$REPO" --clobber

  # Step 6 of the release recipe, which was a manual chore: repoint the deploy
  # artefacts at the digest that was just published. Purely mechanical -- the
  # script derives everything from the tag -- so it runs here and lands as a PR
  # rather than waiting to be remembered (#616).
  sync-deploy-digests:
    needs: [quality-gate, docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch ci.yml on the sync branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Sync digests and open the follow-up PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.quality-gate.outputs.tag }}
        run: |
          set -euo pipefail
          bun scripts/sync-deploy-digests.ts "$TAG"

          if git diff --quiet; then
            echo "deploy artefacts already carry this digest; nothing to sync" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="chore/sync-deploy-digests-${TAG}"
          git config user.name iuliandita
          git config user.email iulian.dita@gmail.com
          git switch -c "$branch"
          git commit -am "chore(release): sync deploy digests"
          git push --force-with-lease origin "$branch"

          # Pushes and PRs made with the workflow token do not start pull_request runs, so
          # required checks would never report. A dispatched run attaches its check runs to
          # the branch head commit, which is what the PR's required checks read (#938).
          gh workflow run ci.yml --ref "$branch"

          # A rerun of the same release should update the existing PR, not stack another.
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "existing PR updated for $branch" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              printf 'Repoints `deploy/` and the README example pins at the digest published for `%s`.\n\n' "$TAG"
              printf 'Generated by `scripts/sync-deploy-digests.ts`. CI runs on this branch through a workflow dispatch because a PR opened with the workflow token does not trigger checks itself; the required checks report from that run. `bun run check:versions` already asserts the digests agree across the deploy files.\n'
            } > /tmp/sync-pr-body.md
            gh pr create --base main --head "$branch" \
              --title "chore(release): sync deploy digests" \
              --body-file /tmp/sync-pr-body.md
          fi
