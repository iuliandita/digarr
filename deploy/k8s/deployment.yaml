# Digarr Deployment
# Customize: image tag, namespace, resource limits, and secret name.
# Create digarr-db from a protected env file containing DATABASE_URL:
#   kubectl create secret generic digarr-db --from-env-file=/path/to/database.env -n digarr
# Configure ALLOWED_ORIGIN and DIGARR_ENCRYPTION_KEY before startup; see the
# commented env entries below. Keep the key separate from database backups.
#
# To run the embedded PGlite backend instead of external Postgres:
#   1. Remove the DATABASE_URL env entry below.
#   2. Add env: - name: DB_PATH value: /app/data
#   3. Add a PVC (digarr-data, ReadWriteOnce) + volume `data` + volumeMount /app/data.
#   4. Change strategy to: type: Recreate  (single-writer file; no surge pods).
#   5. Raise the app memory limit to at least 768Mi (1Gi recommended).
# The default RollingUpdate can briefly run two app processes, duplicating
# process-local schedules or locks even with PostgreSQL. Use Recreate, or
# scale to zero before updates if downtime is acceptable; keep one replica.
# See deploy/helm for a templated version of both backends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digarr
  namespace: digarr # change to your namespace
  labels:
    app: digarr
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: digarr
  template:
    metadata:
      labels:
        app: digarr
    spec:
      serviceAccountName: digarr
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: digarr
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Pin the digest after publishing each release image. The digest comes from the published registry artifact.
          image: ghcr.io/iuliandita/digarr@sha256:63c57750a95bd1559a128b0b3eace427ddb09db69ad269cb35daa80f9914a5fe
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            # Set the exact browser origin, without a path or trailing slash.
            # - name: ALLOWED_ORIGIN
            #   value: https://digarr.example.com
            # - name: DIGARR_ENCRYPTION_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: digarr-secrets
            #       key: encryption-key
            # Direct HTTP additionally needs DIGARR_ALLOW_INSECURE_COOKIES=true.
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: digarr-db # name of your Secret
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: backups
              mountPath: /app/backups
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: backups
          emptyDir: {}
