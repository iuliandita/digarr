{{- if and (eq .Values.database.backend "pglite") (gt (int .Values.replicaCount) 1) }}
{{- fail "database.backend=pglite requires replicaCount=1 (the embedded file has a single writer). Use an external Postgres (database.backend=postgres) to scale out." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "digarr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "digarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if eq .Values.database.backend "pglite" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      {{- include "digarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "digarr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/sensitive-config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "digarr.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ include "digarr.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "digarr.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if eq .Values.database.backend "pglite" }}
            - name: DB_PATH
              value: {{ .Values.database.pglite.path | quote }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "digarr.databaseSecretName" . }}
                  key: DATABASE_URL
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: backups
              mountPath: /app/backups
            {{- if eq .Values.database.backend "pglite" }}
            - name: data
              mountPath: {{ .Values.database.pglite.path }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: backups
          {{- if .Values.backups.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "digarr.fullname" . }}-backups
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if eq .Values.database.backend "pglite" }}
        - name: data
          {{- if .Values.database.pglite.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "digarr.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
