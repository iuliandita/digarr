# Dev override -- additive layer (build from source). Layer on either base:
#   Postgres:  docker compose -f docker-compose.yml         -f docker-compose.dev.yml up
#   PGlite:    docker compose -f docker-compose.pglite.yml  -f docker-compose.dev.yml up
# Only keys that differ from production live here.
#
# Prerequisites for the Postgres base (one-time):
#   cp deploy/docker/secrets/postgres_password.example deploy/docker/secrets/postgres_password

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile

  postgres:
    ports:
      - "5432:5432"
